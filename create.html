<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Birthday Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/create.css" />
  </head>

  <body>
    <!-- Menu -->
    <header class="top-bar">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="Birthday Whispers" />
      </a>

      <button
        id="soundToggle"
        class="sound-button"
        type="button"
        aria-label="Toggle sound"
      >
        <img id="soundIcon" src="images/soundon.png" alt="SoundOn" />
      </button>
    </header>

    <main class="create-container">
      <!-- Create page input -->
      <form id="birthdayForm" class="create-form">
        <h1>Create your page</h1>

        <input
          type="text"
          id="name"
          name="name"
          placeholder="Birthday person's name..."
          maxlength="60"
          autocomplete="name"
          required
        />
        <input
          type="date"
          id="birthday"
          name="birthday"
          aria-label="Birthday date"
          required
        />

        <p id="status" role="status"></p>
      </form>

      <button type="submit" form="birthdayForm" class="create-page-button">
        <img src="images/magic.png" alt="MagicStick" />
        <span>Create Birthday Page</span>
      </button>
    </main>

    <script type="module" src="js/home.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
